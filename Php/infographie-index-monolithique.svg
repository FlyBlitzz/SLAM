<text class="sans" x="1238" y="1605" font-size="19" font-weight="700" letter-spacing="1" fill="#147769">PRÉSENTATION</text>
<text class="sans ink" x="1238" y="1650" font-size="29" font-weight="700">Génération de la page HTML</text>
<text class="sans muted" x="1238" y="1700" font-size="21">Le document charge le CSS et affiche</text>
<text class="sans muted" x="1238" y="1734" font-size="21">l’en-tête et la navigation.</text>
<text class="sans muted" x="1238" y="1800" font-size="21">La confirmation dépend de $success.</text>
<text class="sans muted" x="1238" y="1866" font-size="21">Le titre indique le nombre de films</text>
<text class="sans muted" x="1238" y="1900" font-size="21">et propose un lien d’ajout.</text>
<text class="sans muted" x="1238" y="1966" font-size="21">La page affiche un état vide ou une</text>
<text class="sans muted" x="1238" y="2000" font-size="21">carte par film ; les valeurs affichées</text>
