<text class="mono muted" x="96" y="435.0" font-size="18" >004</text>
<text class="mono" x="176" y="435.0" font-size="21" fill="#14263d" xml:space="preserve">// APPLICATION MONOLITHIQUE AMÉLIORÉE (SANS MVC)</text>
<text class="mono muted" x="96" y="464.0" font-size="18" >005</text>
<text class="mono" x="176" y="464.0" font-size="21" fill="#14263d" xml:space="preserve">// Page : Liste des films</text>
<text class="mono muted" x="96" y="493.0" font-size="18" >006</text>
<text class="mono" x="176" y="493.0" font-size="21" fill="#14263d" xml:space="preserve">// ------------------------------------------------------------</text>
<text class="mono muted" x="96" y="522.0" font-size="18" >007</text>
<text class="mono" x="176" y="522.0" font-size="21" fill="#14263d" xml:space="preserve">// Caractéristiques de cette étape :</text>
<text class="mono muted" x="96" y="551.0" font-size="18" >008</text>
<text class="mono" x="176" y="551.0" font-size="21" fill="#14263d" xml:space="preserve">// 1. Découpage par pages : chaque écran a sa propre page PHP</text>
<text class="mono muted" x="96" y="580.0" font-size="18" >009</text>
<text class="mono" x="176" y="580.0" font-size="21" fill="#14263d" xml:space="preserve">//    (ici la liste, dans creer.php le formulaire d&#x27;ajout).</text>
<text class="mono muted" x="96" y="609.0" font-size="18" >010</text>
<text class="mono" x="176" y="609.0" font-size="21" fill="#14263d" xml:space="preserve">// 2. Mutualisation de la connexion PDO dans db.php.</text>
<text class="mono muted" x="96" y="638.0" font-size="18" >011</text>
<text class="mono" x="176" y="638.0" font-size="21" fill="#14263d" xml:space="preserve">// 3. Toujours PAS de MVC : la page traite sa requête,</text>
<text class="mono muted" x="96" y="667.0" font-size="18" >012</text>
<text class="mono" x="176" y="667.0" font-size="21" fill="#14263d" xml:space="preserve">//    exécute sa requête SQL et génère son propre HTML.</text>
<text class="mono muted" x="96" y="696.0" font-size="18" >013</text>
<text class="mono" x="176" y="696.0" font-size="21" fill="#14263d" xml:space="preserve">// ------------------------------------------------------------</text>
<text class="sans" x="1238" y="423.5" font-size="19" font-weight="700" letter-spacing="1" fill="#52637a">COMMENTAIRES</text>
<text class="sans ink" x="1238" y="466.5" font-size="29" font-weight="700">Présentation du fichier</text>
<text class="sans muted" x="1238" y="504.5" font-size="21" >Les commentaires annoncent le rôle de</text>
<text class="sans muted" x="1238" y="538.5" font-size="21" >la page et ses choix d&#x27;organisation.</text>
<text class="sans muted" x="1238" y="572.5" font-size="21" >Ils ne déclenchent aucun traitement.</text>
